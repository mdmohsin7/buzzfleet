name: release

# Tag-driven, so `install.sh` always has a `latest` to fetch. Without published
# assets the one-command install has nothing to download.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: go/go.sum

      - name: Test
        run: cd go && go vet ./... && go test ./...

      - name: Build
        # CGO off so the binaries are static and run on any glibc, musl or
        # container image without a matching toolchain.
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            echo "building $os/$arch"
            (cd go && CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "../dist/buzzfleet-$os-$arch" ./cmd/buzzfleet)
          done
          cd dist && sha256sum * > checksums.txt && cat checksums.txt

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
